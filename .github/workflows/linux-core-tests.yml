name: Linux Core Tests

on:
  push:
    branches:
      - 2026-09-15-mulit-target
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-core-tests:
    name: Ubuntu 24.04 / GCC / Core Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build

      - name: Configure
        run: |
          cmake \
            -S . \
            -B out/build/linux-debug \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DROBOTVISION_BUILD_DEMO=OFF

      - name: Build
        run: |
          cmake \
            --build out/build/linux-debug \
            --parallel

      - name: Run tests
        run: |
          ctest \
            --test-dir out/build/linux-debug \
            --output-on-failure
